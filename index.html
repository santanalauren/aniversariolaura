<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura faz 5 anos! 🍍</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .bg-spongebob {
            background-color: #C4E8FE;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ====== CONFIGURAÇÃO DO FIREBASE ======
        // SUBSTITUA COM SUAS CREDENCIAIS DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAtMaxqDU-1PyctKpB3m9_RZ7ZCoPtXRDw",
            authDomain: "festa-laura.firebaseapp.com",
            databaseURL: "https://festa-laura-default-rtdb.firebaseio.com",
            projectId: "festa-laura",
            storageBucket: "festa-laura.firebasestorage.app",
            messagingSenderId: "802094712334",
            appId: "1:802094712334:web:b02feaba53912555851e5f"
        };

        // Inicializa Firebase
        let database;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
        } catch (error) {
            console.error("Erro ao inicializar Firebase:", error);
        }

        const RSVPSystem = () => {
            const [view, setView] = useState('home');
            const [attendances, setAttendances] = useState([]);
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');
            const [firebaseReady, setFirebaseReady] = useState(false);

            const [formData, setFormData] = useState({
                name: '',
                attended: true,
                guests: 0,
                guestNames: [],
                hasChildren: false,
                childrenCount: 0,
                message: '',
                token: ''
            });

            const [password, setPassword] = useState('');
            const ADMIN_PASSWORD = 'festadalaura';

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                if (token) {
                    setFormData(prev => ({ ...prev, token }));
                }

                // Verifica se Firebase está configurado
                if (database) {
                    setFirebaseReady(true);
                }
            }, []);

            useEffect(() => {
                if (isAuthenticated && firebaseReady) {
                    loadAttendances();
                }
            }, [isAuthenticated, firebaseReady]);

            const loadAttendances = () => {
                if (!database) {
                    console.error('Firebase não está configurado');
                    return;
                }

                setLoading(true);
                const attendancesRef = database.ref('attendances');
                
                attendancesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const attendancesList = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setAttendances(attendancesList.sort((a, b) => 
                            new Date(b.created_at) - new Date(a.created_at)
                        ));
                    } else {
                        setAttendances([]);
                    }
                    setLoading(false);
                });

                return () => attendancesRef.off();
            };

            const saveAttendance = async (attendance) => {
                if (!database) {
                    throw new Error('Firebase não está configurado');
                }

                const attendancesRef = database.ref('attendances');
                const newAttendanceRef = attendancesRef.push();
                await newAttendanceRef.set(attendance);
                return newAttendanceRef.key;
            };

            const handleGuestsChange = (value) => {
                const guestsNum = parseInt(value) || 0;
                const newGuestNames = Array(guestsNum).fill('').map((_, i) => 
                    formData.guestNames[i] || ''
                );
                setFormData({ 
                    ...formData, 
                    guests: value,
                    guestNames: newGuestNames
                });
            };

            const handleGuestNameChange = (index, value) => {
                const newGuestNames = [...formData.guestNames];
                newGuestNames[index] = value;
                setFormData({ ...formData, guestNames: newGuestNames });
            };

            const handleSubmitRSVP = async () => {
                if (!firebaseReady) {
                    setMessage('❌ Sistema não está configurado. Entre em contato com os organizadores.');
                    return;
                }

                if (!formData.name.trim()) {
                    setMessage('Por favor, informe seu nome');
                    return;
                }

                if (formData.attended && formData.guests > 0) {
                    const emptyNames = formData.guestNames.some(name => !name.trim());
                    if (emptyNames) {
                        setMessage('Por favor, informe o nome de todos os acompanhantes');
                        return;
                    }
                }

                if (formData.hasChildren && (!formData.childrenCount || formData.childrenCount <= 0)) {
                    setMessage('Por favor, informe a quantidade de crianças');
                    return;
                }

                setLoading(true);
                setMessage('');

                try {
                    const attendance = {
                        name: formData.name.trim(),
                        attended: formData.attended,
                        guests: parseInt(formData.guests) || 0,
                        guestNames: formData.guestNames.filter(name => name.trim()),
                        hasChildren: formData.hasChildren,
                        childrenCount: formData.hasChildren ? parseInt(formData.childrenCount) : 0,
                        message: formData.message.trim(),
                        token: formData.token,
                        checked_in: false,
                        created_at: new Date().toISOString()
                    };

                    await saveAttendance(attendance);

                    setMessage(formData.attended ? 
                        '✅ Presença confirmada com sucesso!' : 
                        '📝 Resposta registrada. Sentiremos sua falta!');
                    
                    setFormData({
                        name: '',
                        attended: true,
                        guests: 0,
                        guestNames: [],
                        hasChildren: false,
                        childrenCount: 0,
                        message: '',
                        token: formData.token
                    });

                    setTimeout(() => setMessage(''), 5000);
                } catch (error) {
                    setMessage('❌ Erro ao registrar. Tente novamente.');
                    console.error(error);
                }

                setLoading(false);
            };

            const handleLogin = () => {
                if (password === ADMIN_PASSWORD) {
                    setIsAuthenticated(true);
                    setView('admin');
                    setPassword('');
                } else {
                    setMessage('❌ Senha incorreta');
                    setTimeout(() => setMessage(''), 3000);
                }
            };

            const handleCheckIn = async (id) => {
                if (!database) return;
                
                const attendance = attendances.find(a => a.id === id);
                if (attendance) {
                    await database.ref(`attendances/${id}`).update({
                        checked_in: !attendance.checked_in
                    });
                }
            };

            const exportCSV = () => {
                const headers = ['Nome', 'Confirmou', 'Acompanhantes', 'Nomes Acompanhantes', 'Tem Crianças', 'Qtd Crianças', 'Mensagem', 'Check-in', 'Data'];
                const rows = attendances.map(a => [
                    a.name,
                    a.attended ? 'Sim' : 'Não',
                    a.guests,
                    (a.guestNames || []).join('; '),
                    a.hasChildren ? 'Sim' : 'Não',
                    a.childrenCount || 0,
                    a.message || '',
                    a.checked_in ? 'Sim' : 'Não',
                    new Date(a.created_at).toLocaleString('pt-BR')
                ]);

                const csv = [headers, ...rows].map(row => 
                    row.map(cell => `"${cell}"`).join(',')
                ).join('\n');

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `confirmacoes_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            };

            const filteredAttendances = attendances.filter(a => {
                const matchesSearch = a.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesFilter = filterStatus === 'all' || 
                    (filterStatus === 'confirmed' && a.attended) ||
                    (filterStatus === 'declined' && !a.attended) ||
                    (filterStatus === 'checked' && a.checked_in);
                return matchesSearch && matchesFilter;
            });

            const stats = {
                total: attendances.length,
                confirmed: attendances.filter(a => a.attended).length,
                declined: attendances.filter(a => !a.attended).length,
                checkedIn: attendances.filter(a => a.checked_in).length,
                totalGuests: attendances.reduce((sum, a) => sum + (a.attended ? a.guests : 0), 0),
                totalChildren: attendances.reduce((sum, a) => sum + (a.attended && a.hasChildren ? a.childrenCount : 0), 0)
            };

            if (view === 'home') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-spongebob">
                        <div className="bg-white bg-opacity-95 backdrop-blur-sm rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                            <div className="mb-6">
                                <div className="text-7xl mb-4">🍍</div>
                                <h1 className="text-5xl font-bold text-yellow-500 mb-3" style={{textShadow: '2px 2px 4px rgba(0,0,0,0.2)'}}>LAURA</h1>
                                <p className="text-2xl text-pink-600 font-bold mb-2">está fazendo 5 aninhos!</p>
                                <p className="text-gray-700 text-lg font-semibold">Venha comemorar comigo!🎈</p>
                            </div>

                            <div className="space-y-4 mb-8">
                                <div className="bg-yellow-50 border-2 border-yellow-400 rounded-xl p-4">
                                    <p className="text-sm text-gray-600 mb-1">📅Quando?</p>
                                    <p className="text-xl font-semibold text-gray-800">18 de Janeiro de 2026</p>
                                    <p className="text-sm text-gray-600">Domingo</p>
                                </div>
                                <div className="bg-yellow-50 border-2 border-yellow-400 rounded-xl p-4">
                                    <p className="text-sm text-gray-600 mb-1">🕐Horário:</p>
                                    <p className="text-xl font-semibold text-gray-800">13:00 às 19:00</p>
                                </div>
                                <div className="bg-yellow-50 border-2 border-yellow-400 rounded-xl p-4">
                                    <p className="text-sm text-gray-600 mb-1">📍Local:</p>
                                    <p className="text-lg font-semibold text-gray-800">Rua Dinorah Ferreira Messeder, 98B</p>
                                    <p className="text-sm text-gray-600">Heliópolis - Belo Horizonte/MG</p>
                                </div>
                            </div>

                            <button
                                onClick={() => setView('rsvp')}
                                className="w-full bg-gradient-to-r from-yellow-400 to-yellow-500 text-white font-bold py-4 px-6 rounded-xl hover:from-yellow-500 hover:to-yellow-600 transition-all transform hover:scale-105 shadow-lg mb-4 border-2 border-yellow-600"
                            >
                                🍍Confirmar Presença!
                            </button>

                            <button
                                onClick={() => setView('login')}
                                className="w-full bg-gray-100 text-gray-700 font-medium py-3 px-6 rounded-xl hover:bg-gray-200 transition-all flex items-center justify-center gap-2"
                            >
                                🔒 Painel Admin
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'rsvp') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-cyan-400 via-blue-400 to-blue-500 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full">
                            <button
                                onClick={() => setView('home')}
                                className="mb-6 text-gray-600 hover:text-gray-800 flex items-center gap-2"
                            >
                                🏠 Voltar
                            </button>

                            <h2 className="text-3xl font-bold text-gray-800 mb-6 text-center">Confirme sua Presença</h2>

                            {!firebaseReady && (
                                <div className="mb-4 p-4 rounded-xl bg-red-50 text-red-800">
                                    ⚠️ Sistema não configurado. Entre em contato com os organizadores.
                                </div>
                            )}

                            {message && (
                                <div className={`mb-4 p-4 rounded-xl ${message.includes('✅') ? 'bg-green-50 text-green-800' : message.includes('❌') ? 'bg-red-50 text-red-800' : 'bg-blue-50 text-blue-800'}`}>
                                    {message}
                                </div>
                            )}

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Nome completo *
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.name}
                                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                        className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Você vai à festa? *
                                    </label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            type="button"
                                            onClick={() => setFormData({ ...formData, attended: true })}
                                            className={`py-3 px-4 rounded-xl border-2 font-medium transition-all flex items-center justify-center gap-2 ${
                                                formData.attended
                                                    ? 'border-green-500 bg-green-50 text-green-700'
                                                    : 'border-gray-200 text-gray-600 hover:border-gray-300'
                                            }`}
                                        >
                                            ✓ Sim, vou!
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setFormData({ ...formData, attended: false })}
                                            className={`py-3 px-4 rounded-xl border-2 font-medium transition-all flex items-center justify-center gap-2 ${
                                                !formData.attended
                                                    ? 'border-red-500 bg-red-50 text-red-700'
                                                    : 'border-gray-200 text-gray-600 hover:border-gray-300'
                                            }`}
                                        >
                                            ✗ Não posso
                                        </button>
                                    </div>
                                </div>

                                {formData.attended && (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Número de acompanhantes
                                            </label>
                                            <input
                                                type="number"
                                                min="0"
                                                max="10"
                                                value={formData.guests}
                                                onChange={(e) => handleGuestsChange(e.target.value)}
                                                className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:outline-none"
                                            />
                                        </div>

                                        {formData.guests > 0 && (
                                            <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-4 space-y-3">
                                                <p className="text-sm font-semibold text-blue-800 mb-2">
                                                    Nome dos acompanhantes *
                                                </p>
                                                {Array.from({ length: parseInt(formData.guests) || 0 }).map((_, index) => (
                                                    <input
                                                        key={index}
                                                        type="text"
                                                        value={formData.guestNames[index] || ''}
                                                        onChange={(e) => handleGuestNameChange(index, e.target.value)}
                                                        placeholder={`Nome do acompanhante ${index + 1}`}
                                                        className="w-full px-4 py-3 rounded-xl border-2 border-blue-200 focus:border-blue-500 focus:outline-none"
                                                    />
                                                ))}
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Tem crianças na lista? * 👶
                                            </label>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button
                                                    type="button"
                                                    onClick={() => setFormData({ ...formData, hasChildren: true })}
                                                    className={`py-3 px-4 rounded-xl border-2 font-medium transition-all flex items-center justify-center gap-2 ${
                                                        formData.hasChildren
                                                            ? 'border-pink-500 bg-pink-50 text-pink-700'
                                                            : 'border-gray-200 text-gray-600 hover:border-gray-300'
                                                    }`}
                                                >
                                                    ✓ Sim
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => setFormData({ ...formData, hasChildren: false, childrenCount: 0 })}
                                                    className={`py-3 px-4 rounded-xl border-2 font-medium transition-all flex items-center justify-center gap-2 ${
                                                        !formData.hasChildren
                                                            ? 'border-gray-500 bg-gray-50 text-gray-700'
                                                            : 'border-gray-200 text-gray-600 hover:border-gray-300'
                                                    }`}
                                                >
                                                    ✗ Não
                                                </button>
                                            </div>
                                        </div>

                                        {formData.hasChildren && (
                                            <div className="bg-pink-50 border-2 border-pink-200 rounded-xl p-4">
                                                <label className="block text-sm font-medium text-pink-800 mb-2">
                                                    Quantas crianças? * 🎁
                                                </label>
                                                <input
                                                    type="number"
                                                    min="1"
                                                    max="10"
                                                    value={formData.childrenCount}
                                                    onChange={(e) => setFormData({ ...formData, childrenCount: e.target.value })}
                                                    className="w-full px-4 py-3 rounded-xl border-2 border-pink-200 focus:border-pink-500 focus:outline-none"
                                                    placeholder="Número de crianças"
                                                />
                                                <p className="text-xs text-pink-700 mt-2">
                                                    Essa informação nos ajuda a preparar as lembrancinhas! 🎈
                                                </p>
                                            </div>
                                        )}
                                    </>
                                )}

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Mensagem (opcional)
                                    </label>
                                    <textarea
                                        value={formData.message}
                                        onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                                        rows="3"
                                        className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:outline-none resize-none"
                                        placeholder="Deixe uma mensagem carinhosa..."
                                    />
                                </div>

                                <button
                                    onClick={handleSubmitRSVP}
                                    disabled={loading || !firebaseReady}
                                    className="w-full bg-gradient-to-r from-blue-500 to-cyan-600 text-white font-bold py-4 px-6 rounded-xl hover:from-blue-600 hover:to-cyan-700 transition-all transform hover:scale-105 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    {loading ? 'Enviando...' : 'Enviar Confirmação'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'login' && !isAuthenticated) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <button
                                onClick={() => setView('home')}
                                className="mb-6 text-gray-600 hover:text-gray-800 flex items-center gap-2"
                            >
                                🏠 Voltar
                            </button>

                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">🔒</div>
                                <h2 className="text-2xl font-bold text-gray-800">Painel Administrativo</h2>
                                <p className="text-gray-600 mt-2">Acesso restrito aos organizadores</p>
                            </div>

                            {message && (
                                <div className="mb-4 p-4 rounded-xl bg-red-50 text-red-800">
                                    {message}
                                </div>
                            )}

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Senha
                                    </label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                        className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gray-800 focus:outline-none"
                                        placeholder="Digite a senha"
                                    />
                                </div>

                                <button
                                    onClick={handleLogin}
                                    className="w-full bg-gray-800 text-white font-bold py-3 px-6 rounded-xl hover:bg-gray-900 transition-all"
                                >
                                    Entrar
                                </button>
                            </div>

                            <p className="text-xs text-gray-500 text-center mt-6">
                                Acesso permitido somente aos papais da Laura!
                            </p>
                        </div>
                    </div>
                );
            }

            if (view === 'admin' && isAuthenticated) {
                return (
                    <div className="min-h-screen bg-gray-50 p-4">
                        <div className="max-w-6xl mx-auto">
                            <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h1 className="text-3xl font-bold text-gray-800">Painel Administrativo</h1>
                                    <button
                                        onClick={() => {
                                            setIsAuthenticated(false);
                                            setView('home');
                                        }}
                                        className="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300"
                                    >
                                        Sair
                                    </button>
                                </div>

                                {!firebaseReady && (
                                    <div className="mb-6 p-4 rounded-xl bg-red-50 text-red-800">
                                        ⚠️ Firebase não configurado. Configure as credenciais no código.
                                    </div>
                                )}

                                <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
                                    <div className="bg-blue-50 rounded-xl p-4">
                                        <p className="text-sm text-blue-600 mb-1">Total</p>
                                        <p className="text-2xl font-bold text-blue-800">{stats.total}</p>
                                    </div>
                                    <div className="bg-green-50 rounded-xl p-4">
                                        <p className="text-sm text-green-600 mb-1">Confirmados</p>
                                        <p className="text-2xl font-bold text-green-800">{stats.confirmed}</p>
                                    </div>
                                    <div className="bg-red-50 rounded-xl p-4">
                                        <p className="text-sm text-red-600 mb-1">Recusados</p>
                                        <p className="text-2xl font-bold text-red-800">{stats.declined}</p>
                                    </div>
                                    <div className="bg-purple-50 rounded-xl p-4">
                                        <p className="text-sm text-purple-600 mb-1">Check-in</p>
                                        <p className="text-2xl font-bold text-purple-800">{stats.checkedIn}</p>
                                    </div>
                                    <div className="bg-orange-50 rounded-xl p-4">
                                        <p className="text-sm text-orange-600 mb-1">Acompanhantes</p>
                                        <p className="text-2xl font-bold text-orange-800">{stats.totalGuests}</p>
                                    </div>
                                    <div className="bg-pink-50 rounded-xl p-4">
                                        <p className="text-sm text-pink-600 mb-1">Crianças 👶</p>
                                        <p className="text-2xl font-bold text-pink-800">{stats.totalChildren}</p>
                                    </div>
                                </div>

                                <div className="flex flex-col md:flex-row gap-4 mb-6">
                                    <input
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder="Buscar por nome..."
                                        className="flex-1 px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-gray-800 focus:outline-none"
                                    />
                                    <select
                                        value={filterStatus}
                                        onChange={(e) => setFilterStatus(e.target.value)}
                                        className="px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-gray-800 focus:outline-none"
                                    >
                                        <option value="all">Todos</option>
                                        <option value="confirmed">Confirmados</option>
                                        <option value="declined">Recusados</option>
                                        <option value="checked">Com check-in</option>
                                    </select>
                                    <button
                                        onClick={exportCSV}
                                        className="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 flex items-center gap-2 justify-center"
                                    >
                                        📥 Exportar CSV
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    {loading ? (
                                        <p className="text-center text-gray-600 py-8">Carregando...</p>
                                    ) : filteredAttendances.length === 0 ? (
                                        <p className="text-center text-gray-600 py-8">Nenhum registro encontrado</p>
                                    ) : (
                                        filteredAttendances.map((attendance) => (
                                            <div
                                                key={attendance.id}
                                                className="bg-gray-50 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4"
                                            >
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-3 mb-2 flex-wrap">
                                                        <h3 className="font-bold text-lg text-gray-800">{attendance.name}</h3>
                                                        {attendance.attended ? (
                                                            <span className="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-medium">
                                                                Confirmou
                                                            </span>
                                                        ) : (
                                                            <span className="bg-red-100 text-red-700 text-xs px-3 py-1 rounded-full font-medium">
                                                                Não vai
                                                            </span>
                                                        )}
                                                        {attendance.checked_in && (
                                                            <span className="bg-purple-100 text-purple-700 text-xs px-3 py-1 rounded-full font-medium">
                                                                ✓ Check-in
                                                            </span>
                                                        )}
                                                        {attendance.hasChildren && (
                                                            <span className="bg-pink-100 text-pink-700 text-xs px-3 py-1 rounded-full font-medium">
                                                                👶 {attendance.childrenCount} criança(s)
                                                            </span>
                                                        )}
                                                    </div>
                                                    {attendance.guests > 0 && (
                                                        <div className="mb-1">
                                                            <p className="text-sm text-gray-600 font-medium">
                                                                👥 {attendance.guests} acompanhante(s):
                                                            </p>
                                                            {attendance.guestNames && attendance.guestNames.length > 0 && (
                                                                <p className="text-sm text-gray-700 ml-5">
                                                                    {attendance.guestNames.join(', ')}
                                                                </p>
                                                            )}
                                                        </div>
                                                    )}
                                                    {attendance.message && (
                                                        <p className="text-sm text-gray-600 italic">"{attendance.message}"</p>
                                                    )}
                                                    <p className="text-xs text-gray-400 mt-2">
                                                        {new Date(attendance.created_at).toLocaleString('pt-BR')}
                                                    </p>
                                                </div>
                                                {attendance.attended && (
                                                    <button
                                                        onClick={() => handleCheckIn(attendance.id)}
                                                        className={`px-4 py-2 rounded-lg font-medium transition-all ${
                                                            attendance.checked_in
                                                                ? 'bg-purple-600 text-white hover:bg-purple-700'
                                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                        }`}
                                                    >
                                                        {attendance.checked_in ? 'Desfazer Check-in' : 'Fazer Check-in'}
                                                    </button>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<RSVPSystem />);
    </script>
</body>
</html>
